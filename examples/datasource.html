<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>用 DataSource 按需生成草地</title>
    <style>
      body {
        margin: 0;
        height: 100dvh;
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
        font: 1rem/1.5 system-ui;
      }
      output {
        padding: .4rem 1rem;
        max-height: 5em;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <div id="world"></div>
    <output id="subscriptions">等待区域订阅…</output>
    <button id="jump">切换区域</button>
    <script type="module">
      import { mount, blockHash, encodeRegion } from "https://omega-1259160345.cos.accelerate.myqcloud.com/r2/r2-frontend.js";

      // 每个区域都生成同样的 32×32 草地。只保留一个 16×16×16 子区块的模板。
      const blocks = new Uint32Array(16 ** 3);
      const grass = blockHash('minecraft:grass_block ["snowy"="false"]');
      for (let x = 0; x < 16; x++) {
        for (let z = 0; z < 16; z++) {
          blocks[(x * 16 + z) * 16] = grass; // 格子按 X、Z、Y 排列，只填 y = 0。
        }
      }

      // 一个区域横跨 8×8 个区块。编码器使用世界子区块坐标，草地占其中的 2×2 个。
      function grassRegion(regionX, regionZ) {
        const sections = [];
        for (let dx = 0; dx < 2; dx++) {
          for (let dz = 0; dz < 2; dz++) {
            sections.push({ position: [regionX * 8 + dx, 0, regionZ * 8 + dz], blocks });
          }
        }
        return encodeRegion(sections);
      }

      const subscriptions = document.querySelector("#subscriptions");
      function regionList(regions) {
        return regions.map(({ x, z }) => `(${x}, ${z})`).join("、") || "无";
      }

      let sink;
      const source = {
        open(receiver) {
          sink = receiver;
        },
        want({ regions, objects }) {
          if (regions.add.length || regions.remove.length) {
            subscriptions.textContent = `订阅 ${regionList(regions.add)}；移出 ${regionList(regions.remove)}`;
          }
          // 每次请求都交付新缓冲区。生成是同步的，退订时没有待取消的任务。
          for (const { x, z } of regions.add) sink.region(x, z, grassRegion(x, z));
          // 草地只有普通方块，因此每个近景请求都返回空的 Minecraft 快照。
          for (const { x, z } of objects.add) sink.near(x, z, { blockEntities: [], entities: [] });
        },
        close() {
          sink = undefined;
        },
      };

      const camera = { position: [16, 8, 32], yaw: 0, pitch: -0.45 };
      const jump = document.querySelector("#jump");
      const view = await mount(document.querySelector("#world"), {
        source,
        camera,
        actions: jump,
        helpHTML: "<h3>草地的位置</h3><p>每隔 128 格有一块草地。点击切换区域可在相邻的两块草地之间往返。</p>",
      });
      let regionX = 0;
      jump.onclick = () => {
        regionX = 1 - regionX;
        view.moveCamera({ ...camera, position: [regionX * 128 + 16, 8, 32] });
      };
      window.addEventListener("pagehide", event => {
        if (!event.persisted) view.dispose(); // 关闭查看器时也会调用数据源的 close()。
      });
    </script>
  </body>
</html>
