<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/r2/common_ui/style.css" />
    <title>neOmega R2 · 内存场景</title>
    <script type="importmap">{ "imports": { "neomega-r2": "/r2/index.js" } }</script>
  </head>
  <body>
    <template id="actions">
      <select id="scene" aria-label="选择演示场景" title="选择演示场景"></select>
      <i class="divider"></i>
    </template>
    <template id="settings-extra">
      <h3>场景调试</h3>
      <label class="setting">求交显示<select id="debug">
        <option value="0">正常画面</option>
        <option value="1">遍历 / 求交热图</option>
        <option value="2">求交路径</option>
      </select></label>
      <label class="setting">空域与均匀立方体跳跃<input id="hierarchy" class="switch" type="checkbox" checked /></label>
      <label class="setting">跨格片段<input id="fragments" class="switch" type="checkbox" checked /></label>
      <output id="status" class="hint"></output>
    </template>
    <script type="module" src="/r2/common_ui/boot.js" data-entry="/dist/main.js"></script>
  </body>
</html>
