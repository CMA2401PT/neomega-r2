<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><link rel="icon" href="data:," />
  <title>neomega-r2 · 格子内模型射线</title>
  <style>
    body {
      margin: 0;
      background: #19222d;
      color: #edf1f5;
      font: 14px system-ui;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    aside {
      position: fixed;
      left: 16px;
      top: 16px;
      max-width: 560px;
      background: #17212beb;
      padding: 16px;
      border-radius: 8px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 18px;
    }
    select,
    button {
      font: inherit;
      margin-right: 8px;
    }
    p {
      line-height: 1.5;
      margin: 8px 0;
    }
    #status {
      white-space: pre-line;
      font: 12px monospace;
    }
    .hint {
      opacity: 0.7;
      font-size: 12px;
    }
    label {
      margin-right: 12px;
    }
  </style>
  <canvas id="view"></canvas>
  <aside>
    <h1>R2 · 一个格子，两种求交方式</h1>
    <select id="scene">
      <option value="special">附魔书与独立旗面</option>
      <option value="showcase">综合场景</option>
      <option value="fences">密集栏杆</option>
      <option value="cutouts">密集花朵</option>
      <option value="cubes">完整立方体</option>
      <option value="spill">伸出本格的模型</option>
      <option value="glass8">8 格厚玻璃</option>
      <option value="glass16">16 格厚玻璃</option>
    </select>
    <select id="debug">
      <option value="0">正常画面</option>
      <option value="1">遍历 / 求交热图</option>
      <option value="2">求交路径（绿：立方体，红：模型）</option>
    </select>
    <p>
      <label
        ><input
          id="hierarchy"
          type="checkbox"
          checked
        />空域与均匀立方体跳跃</label
      ><label><input id="fragments" type="checkbox" checked />跨格片段</label>
    </p>
    <p>
      <label
        >像素比例
        <select id="resolution">
          <option value="device">屏幕原生</option>
          <option value="1">1×</option>
          <option value="0.75">0.75×</option>
          <option value="0.5">0.5×</option>
          <option value="2">2×</option>
        </select></label
      >
    </p>
    <div id="status">正在加载共享模型表…</div>
    <p class="hint">
      拖动旋转视角，WASD 前后左右，Q/E
      升降。全屏三角形只负责发射射线；场景没有区域网格。
    </p>
  </aside>
  <script type="module" src="/main.js"></script>
</html>
