name: 构建浏览器入口与材质包

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v6
        with:
          path: neomega-r2
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: CMA2401PT/neomega-blocks
          ref: 18b38b1b396f66e18d3f17af2d2385d345d5d1d0
          path: neomega-blocks
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: CMA2401PT/neomega-nbt
          ref: 0cc62741e754672e8255ead4eda4e4456ca1129d
          path: neomega-nbt
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: neomega-r2/assets-utils/go.mod
          cache-dependency-path: neomega-r2/assets-utils/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: neomega-r2/package-lock.json
      - run: npm ci
        working-directory: neomega-r2
      - uses: astral-sh/setup-uv@v7
      - name: 生成 Java 资源并检验各主题
        working-directory: neomega-r2/assets-utils
        run: |
          python3 resourcegen/generate.py --java 26.3 --out "$RUNNER_TEMP/resources"
          export R2_GENERATED="$RUNNER_TEMP/resources/26.3"
          echo "R2_GENERATED=$R2_GENERATED" >> "$GITHUB_ENV"
          go test ./...
          (cd ../fix-utils && NEOMEGA_BLOCK_TABLES="$R2_GENERATED/java-blocks" go test ./...)
      - name: 构建并验证浏览器发布入口
        working-directory: neomega-r2
        run: |
          npm run build
          npm run check
          npm test
          node scripts/release-browser/assemble.mjs standalone "$RUNNER_TEMP/r2-browser" "$R2_GENERATED/browser-materials"
      - uses: actions/upload-artifact@v6
        with:
          name: r2-browser
          path: ${{ runner.temp }}/r2-browser/
          if-no-files-found: error

  publish:
    name: 上传 JS 和材质包到 COS
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    concurrency:
      group: cos-r2-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          name: r2-browser
          path: r2-browser
      - name: 安装腾讯云 COS SDK
        run: |
          python3 -m venv "$RUNNER_TEMP/cos-sdk"
          "$RUNNER_TEMP/cos-sdk/bin/pip" install cos-python-sdk-v5==1.9.45
      - name: 发布当前主分支的构建产物
        env:
          T_COS_SECRET_ID: ${{ secrets.T_COS_SECRET_ID }}
          T_COS_SECRET_KEY: ${{ secrets.T_COS_SECRET_KEY }}
          T_COS_SERVICE_URL: ${{ secrets.T_COS_SERVICE_URL || vars.T_COS_SERVICE_URL || 'https://ap-nanjing.myqcloud.com' }}
          T_COS_ACCESS_URL: ${{ secrets.T_COS_ACCESS_URL || vars.T_COS_ACCESS_URL || 'https://omega-1259160345.cos.accelerate.myqcloud.com' }}
        run: |
          # 旧构建可能后完成，也可能被手动重跑。只有当前提交更新公开入口。
          tip=$(git ls-remote --exit-code origin refs/heads/main)
          if [[ "${tip%%[[:space:]]*}" != "$GITHUB_SHA" ]]; then
            echo "main 已更新，跳过旧构建的上传。"
            exit 0
          fi
          "$RUNNER_TEMP/cos-sdk/bin/python" scripts/publish-cos.py r2-browser
